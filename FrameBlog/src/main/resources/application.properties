spring.application.name=FrameBlog
server.port=5000

#url de conexção com o banco de dados spring
spring.datasource.url=jdbc:postgresql://localhost:5432/frameblog
spring.datasource.username=postgres
spring.datasource.password=JoaoStudy135

#dialeto do banco de dados
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Driver do banco de dados
spring.datasource.driver-class-name=org.postgresql.Driver

#Cria tababelas automaticamente
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db.migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


FrameBlog.rabbitmq.exchange=FrameBlog.exchange
FrameBlog.rabbitmq.queue=FrameBlog.queue
FrameBlog.rabbitmq.routingkey=FrameBlog.routingkey

logging.level.org.flywaydb=DEBUG
